name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fallisce se boxoffice.json e' illeggibile o manca una chiave usata dalle pagine.
      - name: Build
        run: npm run build

  # Dopo un aggiornamento dei KPI su main verifica che il sito pubblico serva il JSON appena pubblicato.
  # Cloudflare ricostruisce al push: si riprova per qualche minuto finche' generated_at coincide.
  smoke:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check if KPI data changed
        id: changed
        run: |
          if git diff --quiet HEAD~1 HEAD -- src/data/boxoffice.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for the published site to serve the new data
        if: steps.changed.outputs.changed == 'true'
        run: |
          expected=$(jq -r .generated_at src/data/boxoffice.json)
          url="https://boxoffice-site.marco-santagati96.workers.dev/projects/boxoffice/"
          for attempt in $(seq 1 20); do
            if curl -fsS "$url" | grep -qF "datetime=\"$expected\""; then
              echo "Sito aggiornato (generated_at=$expected)"
              exit 0
            fi
            echo "Tentativo $attempt/20: il sito non serve ancora $expected"
            sleep 30
          done
          echo "::error::Il sito pubblico non serve generated_at=$expected dopo 10 minuti"
          exit 1
